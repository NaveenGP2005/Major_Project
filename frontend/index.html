<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Echo • Context-Aware Voice Agent & Living Memory</title>
    <!-- Material Symbols Outlined -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <!-- Typography Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Tailwind CSS with custom Stitch theme -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "error": "#ffb4ab",
              "inverse-primary": "#842bd2",
              "surface-container-highest": "#273647",
              "outline-variant": "#4d4354",
              "primary-fixed-dim": "#ddb7ff",
              "background": "#051424",
              "on-tertiary-fixed-variant": "#004c69",
              "surface-variant": "#273647",
              "tertiary-container": "#009bd1",
              "on-primary": "#490080",
              "error-container": "#93000a",
              "secondary-container": "#00a572",
              "on-primary-fixed": "#2c0051",
              "surface-container-low": "#0d1c2d",
              "surface-container-high": "#1c2b3c",
              "on-secondary-container": "#00311f",
              "secondary": "#4edea3",
              "on-error": "#690005",
              "surface-dim": "#051424",
              "on-secondary-fixed-variant": "#005236",
              "surface": "#051424",
              "surface-tint": "#ddb7ff",
              "on-secondary-fixed": "#002113",
              "tertiary-fixed-dim": "#7bd0ff",
              "secondary-fixed": "#6ffbbe",
              "secondary-fixed-dim": "#4edea3",
              "surface-bright": "#2c3a4c",
              "on-tertiary": "#00354a",
              "primary": "#ddb7ff",
              "on-error-container": "#ffdad6",
              "primary-container": "#b76dff",
              "inverse-surface": "#d4e4fa",
              "on-surface": "#d4e4fa",
              "tertiary-fixed": "#c4e7ff",
              "outline": "#988d9f",
              "on-secondary": "#003824",
              "inverse-on-surface": "#233143",
              "on-primary-fixed-variant": "#6900b3",
              "on-tertiary-fixed": "#001e2c",
              "on-background": "#d4e4fa",
              "on-surface-variant": "#cfc2d6",
              "surface-container-lowest": "#010f1f",
              "surface-container": "#122131",
              "on-primary-container": "#400071",
              "primary-fixed": "#f0dbff",
              "tertiary": "#7bd0ff",
              "on-tertiary-container": "#002d40"
            },
            fontFamily: {
              "label-sm": ["JetBrains Mono", "monospace"],
              "label-md": ["JetBrains Mono", "monospace"],
              "body-md": ["Plus Jakarta Sans", "sans-serif"],
              "body-lg": ["Plus Jakarta Sans", "sans-serif"],
              "headline-xl": ["Plus Jakarta Sans", "sans-serif"],
              "title-md": ["Plus Jakarta Sans", "sans-serif"]
            }
          }
        }
      }
    </script>
    <style>
      @keyframes pulse-halo {
        0%, 100% { transform: scale(1); opacity: 0.45; }
        50% { transform: scale(1.15); opacity: 0.9; }
      }
      @keyframes wave-bounce {
        0%, 100% { height: 6px; }
        50% { height: 26px; }
      }
      @keyframes breathe-core {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 16px rgba(16, 185, 129, 0.45)); }
        50% { transform: scale(1.08); filter: drop-shadow(0 0 28px rgba(168, 85, 247, 0.65)); }
      }
      .animate-pulse-halo { animation: pulse-halo 3s ease-in-out infinite; }
      .animate-breathe-core { animation: breathe-core 4s ease-in-out infinite; }
      
      .wave-bar-1 { animation: wave-bounce 1.1s ease-in-out infinite 0.1s; }
      .wave-bar-2 { animation: wave-bounce 0.9s ease-in-out infinite 0.25s; }
      .wave-bar-3 { animation: wave-bounce 1.4s ease-in-out infinite 0.4s; }
      .wave-bar-4 { animation: wave-bounce 1.0s ease-in-out infinite 0.15s; }
      .wave-bar-5 { animation: wave-bounce 1.2s ease-in-out infinite 0.3s; }
      .wave-bar-6 { animation: wave-bounce 0.8s ease-in-out infinite 0.5s; }

      .glass-card {
        background: rgba(18, 33, 49, 0.65);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(212, 228, 250, 0.08);
      }
      .glass-card-hover:hover {
        border-color: rgba(221, 183, 255, 0.25);
        box-shadow: 0 0 35px -10px rgba(183, 109, 255, 0.18);
      }

      /* Custom scrollbars */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(5, 20, 36, 0.6);
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(152, 141, 159, 0.3);
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(152, 141, 159, 0.5);
      }
    </style>
  </head>
  <body class="bg-surface text-on-surface min-h-screen flex flex-col font-body-md antialiased selection:bg-primary-container selection:text-on-primary-container relative overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
